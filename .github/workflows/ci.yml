name: CI

on:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-host:
    if: github.event_name == 'push' && vars.MAC_HOSTED_RUNNER != ''
    runs-on: ${{ vars.MAC_HOSTED_RUNNER }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Select Xcode 27 and install the Metal toolchain
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version | grep -E '^Xcode 27\.'
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Python and build tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run every Python test module
        run: .venv/bin/python tools/metal/run_python_tests.py
      - name: Check source drift
        run: .venv/bin/python tools/metal/check_drift.py
      - name: Check release policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python tools/metal/check_release_policy.py
          if [ -n "$(.venv/bin/python -c 'from tools.metal import release_metadata; print(release_metadata.RELEASE_REPOSITORY or "")')" ]; then
            .venv/bin/python tools/metal/check_release_policy.py --remote
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::notice::No release repository is configured; remote release-history checks are deferred."
          else
            echo "::error::A release repository must be configured before validating a release branch."
            exit 1
          fi
      - name: Configure and build the Mac CI engine
        run: |
          cmake --preset mac-ci
          cmake --build --preset mac-ci
      - name: Run host tests
        run: ctest --test-dir build-ci -L '^host$' --output-on-failure --no-tests=error
      - name: Build a release asset when B10 is implemented
        if: hashFiles('tools/metal/make_release.py') != ''
        run: .venv/bin/python tools/metal/make_release.py --out dist
      - name: Upload the release asset
        if: always() && hashFiles('dist/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strata-macos-arm64
          path: dist/
          retention-days: 7
      - name: Run the Metal self-test when the engine binary is present
        if: hashFiles('build-ci/strata') != ''
        continue-on-error: true
        run: |
          build-ci/strata --list-devices
          ctest --test-dir build-ci -L '^metal$' --output-on-failure --no-tests=error
